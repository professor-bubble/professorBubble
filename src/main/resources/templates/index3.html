<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>채팅방</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #chatBox {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }
        #messageInput {
            display: flex;
            padding: 10px;
        }
        #messageInput input[type="text"] {
            flex-grow: 1;
            padding: 10px;
            font-size: 16px;
            margin-right: 5px;
        }
        #messageInput input[type="file"] {
            display: none;
        }
        #messageInput button {
            padding: 10px;
            font-size: 16px;
            margin-left: 5px;
        }
        #fileLabel {
            padding: 10px;
            font-size: 16px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            cursor: pointer;
            margin-left: 5px;
        }
    </style>
</head>
<body>
<div id="chatBox"></div>
<div id="messageInput">
    <input type="text" id="message" placeholder="메시지를 입력하세요" />
    <input type="file" id="imageInput" accept="image/*" />
    <label for="imageInput" id="fileLabel">이미지 선택</label>
    <button onclick="sendMessage()">전송</button>
</div>

<script th:inline="javascript">
    // WebSocket 연결 설정
    const socket = new SockJS('/ws-stomp');
    const stompClient = Stomp.over(socket);
    const userId= "61353030-3030-3030-3030-303030303030";
    const chatRoomId = 1;
    const userName = /*[[${userName}]]*/ '알 수 없음';
    const user = /*[[${user}]]*/ {};
    stompClient.connect({}, function (frame) {
        console.log('Connected: ' + frame);

        if (user.role.name === 'PROFESSOR') {
            // 유저가 보낸 메시지 받는 채널
            stompClient.subscribe('/sub/chatroom/' + chatRoomId + '/professor', function (messageOutput) {
                showMessage(JSON.parse(messageOutput.body));
            });
        } else if (user.role.name === 'USER') {
            // 교수 메시지 받는 채널
            stompClient.subscribe('/sub/chatroom/' + chatRoomId, function (messageOutput) {
                showMessage(JSON.parse(messageOutput.body));
            });

            // 본인 메시지 받는 채널
            stompClient.subscribe('/sub/user/' + userId, function (messageOutput) {
                showMessage(JSON.parse(messageOutput.body));
            });
        } else {
            console.warn('알 수 없는 사용자 역할입니다:', user.role.name);
        }
    });


    function sendMessage() {
        const messageText = document.getElementById('message').value;
        const imageInput = document.getElementById('imageInput');
        const file = imageInput.files[0];

        if (file) {
            // 파일을 Base64로 인코딩
            const reader = new FileReader();
            reader.onload = function (event) {
                // event.target.result는 "data:image/png;base64,..." 형식의 문자열
                const base64Image = event.target.result;
                let finalContent = "";
                // 텍스트 메시지가 있으면 텍스트와 Base64 데이터를 줄바꿈(\n)으로 구분하여 결합
                if (messageText.trim() !== "") {
                    finalContent = messageText + "\n" + base64Image;
                } else {
                    finalContent = base64Image;
                }
                sendChatMessage(finalContent);
            };
            reader.readAsDataURL(file);
        } else {
            sendChatMessage(messageText);
        }

        // 입력 필드 초기화
        document.getElementById('message').value = "";
        imageInput.value = "";
    }

    function sendChatMessage(content) {
        let roleToSend = '';

        if (user.role.name === 'PROFESSOR') {
            roleToSend = 'PROFESSOR';
        } else if (user.role.name === 'USER') {
            roleToSend = 'USER';
        } else {
            roleToSend = 'UNKNOWN'; // 예외 처리
        }
        const message = {
            chatRoomId: chatRoomId,
            userId: userId,
            userName: userName,
            content: content,
            role: roleToSend
        };
        console.log("사용자 이름:", userName);
        stompClient.send("/pub/message", {}, JSON.stringify(message));
    }

    function showMessage(message) {
        const chatBox = document.getElementById('chatBox');
        const messageElement = document.createElement('div');

        // message.messageType이 "IMAGE"이면 이미지로 처리, 그렇지 않으면 텍스트로 처리
        if (message.type === "IMAGE") {
            const imageElement = document.createElement('img');
            imageElement.src = message.content; // content는 이미지의 URL 또는 경로
            imageElement.alt = '전송된 이미지';
            imageElement.style.maxWidth = '100%';
            messageElement.innerHTML = `<strong>[${message.userName}]:</strong><br>`;
            messageElement.appendChild(imageElement);
        } else {
            // 일반 텍스트인 경우
            messageElement.innerHTML = `<strong>[${message.userName}]:</strong> ${message.content}`;
        }

        chatBox.appendChild(messageElement);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

</script>
</body>
</html>
